<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Intent Listener</title>

<style>
:root{
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:#f5f7fa;
  background:#090b0f
}

*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(
    circle at 80% 0%,
    #18212d 0,
    #090b0f 42%
  );
  min-height:100vh
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:28px 18px 50px
}

.hero{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:flex-start
}

h1{
  font-size:34px;
  margin:0 0 7px;
  letter-spacing:-1px
}

.sub{
  color:#9ca8b7;
  margin:0;
  max-width:680px;
  line-height:1.5
}

.badge{
  border:1px solid #263241;
  border-radius:999px;
  padding:8px 12px;
  color:#aab7c7;
  font-size:12px;
  white-space:nowrap
}

.card{
  background:rgba(15,19,25,.88);
  border:1px solid #202936;
  border-radius:18px;
  box-shadow:0 12px 50px rgba(0,0,0,.28)
}

.search{
  margin-top:24px;
  padding:18px
}

.row{
  display:flex;
  gap:10px
}

.input{
  flex:1;
  background:#0a0d12;
  border:1px solid #2a3544;
  border-radius:12px;
  color:#fff;
  padding:15px;
  font-size:15px;
  outline:none
}

.input:focus{
  border-color:#6e849f
}

button{
  border:0;
  border-radius:12px;
  padding:0 20px;
  background:#fff;
  color:#07090c;
  font-weight:800;
  cursor:pointer
}

.hint{
  font-size:12px;
  color:#778394;
  margin-top:10px
}

.chips{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px
}

.chip{
  background:#121821;
  border:1px solid #253141;
  border-radius:999px;
  padding:7px 10px;
  color:#aebaca;
  font-size:12px;
  cursor:pointer
}

.meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0 10px;
  color:#8f9baa;
  font-size:12px
}

.results{
  display:grid;
  gap:10px
}

.post{
  padding:16px
}

.top{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.who{
  display:flex;
  gap:10px
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#273242;
  display:grid;
  place-items:center;
  color:#aeb9c7;
